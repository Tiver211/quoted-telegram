{{- if ne (int .Values.replicaCount) 1 }}
{{- fail "Long polling requires replicaCount=1" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quoted-bot.fullname" . }}
  labels:
    {{- include "quoted-bot.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "quoted-bot.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        app.kubernetes.io/name: {{ include "quoted-bot.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "quoted-bot.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- if .Values.proxy.secretName }}
            - name: PROXY_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.proxy.secretName }}
                  key: {{ required "proxy.secretKey is required when proxy.secretName is set" .Values.proxy.secretKey }}
            {{- end }}
            - name: STAGING_CHAT_ID
              value: {{ required "stagingChatId is required for guest sticker delivery" .Values.stagingChatId | quote }}
            - name: DATA_DIR
              value: {{ .Values.persistence.mountPath | quote }}
            - name: RENDER_TIMEOUT
              value: {{ .Values.renderTimeout | quote }}
            - name: BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "secrets.botToken.name is required" .Values.secrets.botToken.name }}
                  key: {{ required "secrets.botToken.key is required" .Values.secrets.botToken.key }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "secrets.databaseUrl.name is required" .Values.secrets.databaseUrl.name }}
                  key: {{ required "secrets.databaseUrl.key is required" .Values.secrets.databaseUrl.key }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "quoted-bot.fullname" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
